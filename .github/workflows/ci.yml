name: CI - Laravel

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests-and-build:
    name: Tests and frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, xml, dom, curl, fileinfo
          coverage: none

      - name: Preparar archivo de entorno
        run: cp .env.example .env

      - name: Instalar dependencias de PHP
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Generar clave de Laravel
        run: php artisan key:generate

      - name: Ejecutar pruebas de Laravel
        run: php artisan test

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias de JavaScript
        run: npm ci

      - name: Compilar frontend
        run: npm run build